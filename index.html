    <style>

body{

    overflow-x:hidden;

    background:
    radial-gradient(circle at 15% 20%, rgba(59,130,246,.55), transparent 35%),
    radial-gradient(circle at 85% 30%, rgba(96,165,250,.45), transparent 40%),
    radial-gradient(circle at 50% 85%, rgba(191,219,254,.60), transparent 45%),
    linear-gradient(
        130deg,
        #ffffff,
        #e4f1ff,
        #cfe8ff,
        #ffffff
    );

   background-size:
    250% 250%,
    250% 250%,
    250% 250%,
    500% 500%;

    animation:
    blob1 12s ease-in-out infinite alternate,
    blob2 16s ease-in-out infinite alternate,
    blob3 20s ease-in-out infinite alternate,
    fondo 12s ease infinite;

}


/* ===========================
   BORDE BRILLANTE
=========================== */

.bg-white{
    position:relative;
    overflow:hidden;
    animation:respirar 6s ease-in-out infinite;
}

.bg-white::before{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:inherit;
    background:linear-gradient(120deg,#3b82f6,#60a5fa,#93c5fd,#3b82f6);
    background-size:300% 300%;
    animation:bordeGlow 6s linear infinite;
    opacity:.35;
    z-index:-1;
}

@keyframes bordeGlow{
    from{background-position:0%;}
    to{background-position:300%;}
} 
@keyframes fondo{

    0%{
        background-position:
            0% 0%,
            100% 0%,
            50% 100%,
            0% 50%;
    }

    50%{
        background-position:
            40% 20%,
            60% 80%,
            30% 40%,
            100% 50%;
    }

    100%{
        background-position:
            0% 0%,
            100% 0%,
            50% 100%,
            0% 50%;
    }

}

@keyframes blob1{

    from{
        background-position:
            0% 0%,
            100% 0%,
            50% 100%,
            0% 50%;
    }

    to{
        background-position:
            25% 15%,
            100% 0%,
            50% 100%,
            0% 50%;
    }

}

@keyframes blob2{

    from{
        filter:hue-rotate(0deg);
    }

    to{
        filter:hue-rotate(12deg);
    }

}

@keyframes blob3{

    from{
        transform:scale(1);
    }

    to{
        transform:scale(1.02);
    }

}


/* ===========================
   BRILLO QUE RECORRE LA TARJETA
=========================== */

.bg-white::after{

    content:"";

    position:absolute;

    width:160px;
    height:250%;

    top:-70%;
    left:-250px;

    background:rgba(255,255,255,.18);

    transform:rotate(25deg);

    animation:brillo 8s linear infinite;

    pointer-events:none;

}

@keyframes brillo{

    0%{
        left:-250px;
    }

    100%{
        left:130%;
    }

}


/* ===========================
   RESPIRACIÓN DE TARJETAS
=========================== */

@keyframes respirar{

    0%,100%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-5px);
    }

}


/* ===========================
   PARTÍCULAS (NO REEMPLAZA TU FONDO)
=========================== */

@keyframes particulas{

    from{
        filter:blur(80px) hue-rotate(0deg);
    }

    to{
        filter:blur(90px) hue-rotate(45deg);
    }

}

/* IMPORTANTE:
   Solo agrega la segunda animación.
   NO reemplaces tu body::after original.
*/

body::after{
    animation:
        blob2 18s ease-in-out infinite alternate,
        particulas 25s linear infinite !important;
}


/* ===========================
   BOTONES
=========================== */

button:hover{
    transform:translateY(-5px) scale(1.04);
    box-shadow:
        0 15px 35px rgba(59,130,246,.35),
        0 0 20px rgba(96,165,250,.4);
}


/* ===========================
   TABLAS
=========================== */

tbody tr{
    transition:.35s;
}

tbody tr:hover{
    transform:translateX(8px) scale(1.01);
}


/* ===========================
   INPUTS
=========================== */

input:focus,
textarea:focus,
select:focus{

    transform:scale(1.02);

    box-shadow:
        0 0 0 2px rgba(59,130,246,.15),
        0 0 30px rgba(59,130,246,.3);

}


/* ===========================
   TÍTULOS
=========================== */

h1,h2,h3{
    animation:titulo 5s ease-in-out infinite;
}

@keyframes titulo{

    0%,100%{
        text-shadow:none;
    }

    50%{
        text-shadow:
            0 0 10px #60a5fa,
            0 0 20px #93c5fd;
    }

}

        }

        @keyframes oleajeFondo {
            0% { background-position: 0% 0%; }
            50% { background-position: 100% 0%; }
            100% { background-position: 0% 0%; }
        }

        /* Fuerza a que las vistas se rendericen por encima del fondo animado */
        #vista-login, #vista-dashboard {
            position: relative;
            z-index: 10;
        }
</style>
</head>

    <script>
        // --- 1. CONFIGURACIÓN DE SUPABASE ---
        const SUPABASE_URL = "https://roygxtdhhtjjvvtmgwmp.supabase.co";
        const SUPABASE_KEY = "sb_publishable_h7Eah3tJSIxM0MpsFs3bAg_aXE_GdRB"; 

        const headers = {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`,
            "Content-Type": "application/json",
            "Prefer": "return=representation"
        };

        // --- 2. ESTADO DE LA APLICACIÓN ---
       let usuarioActual = null;
        let idRolActual = null;
        let nombreRolActual = "";
        let idEstudianteAsociado = null; // 🆕 Guarda el ID si el usuario es un estudiante

        const mapeoRoles = {
            1: "Administrador",
            2: "Docente",
            3: "Estudiante"
        };

        // --- 3. ELEMENTOS DEL DOM ---
        const vistaLogin = document.getElementById('vista-login');
        const vistaDashboard = document.getElementById('vista-dashboard');
        const formLogin = document.getElementById('form-login');
        const loginError = document.getElementById('login-error');
        
        const moduloGestion = document.getElementById('modulo-gestion');
        const moduloBusqueda = document.getElementById('modulo-busqueda');
        const thAcciones = document.getElementById('th-acciones');
        
        const userDisplay = document.getElementById('user-display');
        const roleDisplay = document.getElementById('role-display');
        const btnLogout = document.getElementById('btn-logout');
        
        const formRegistro = document.getElementById('form-registro');
        const tablaCuerpo = document.getElementById('tabla-cuerpo');
        const inputBuscar = document.getElementById('input-buscar');
        const btnBuscar = document.getElementById('btn-buscar');
        const btnLimpiar = document.getElementById('btn-limpiar');
        const moduloCrearAnuncio = document.getElementById('modulo-crear-anuncio');
const moduloListaAnuncios = document.getElementById('modulo-lista-anuncios');
const formAnuncio = document.getElementById('form-anuncio');
const contenedorAnuncios = document.getElementById('contenedor-anuncios');

        let url = "";
        let method = "";

        // --- 4. CONTROL DE ACCESO (LOGIN) ---
        formLogin.addEventListener('submit', async (e) => {
            e.preventDefault();
            const usuarioInput = document.getElementById('login-usuario').value;
            const passInput = document.getElementById('login-password').value;

            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/usuarios?usuario=eq.${usuarioInput}&password=eq.${passInput}`, {
                    method: 'GET',
                    headers: headers
                });
                const data = await response.json();

                if (data && data.length > 0) {
                    const usuarioLogueado = data[0];
                    
                    usuarioActual = usuarioLogueado.usuario;
                    idRolActual = parseInt(usuarioLogueado.id_rol);
                    nombreRolActual = mapeoRoles[idRolActual] || "Desconocido";
                    
                    // 🆕 Captura el id_estudiante asignado en Supabase
                    idEstudianteAsociado = usuarioLogueado.id_estudiante; 
                    
                    const idUsuario = usuarioLogueado.id_usuario; 
                    await fetch(`${SUPABASE_URL}/rest/v1/usuarios?id_usuario=eq.${idUsuario}`, {
                        method: 'PATCH',
                        headers: headers,
                        body: JSON.stringify({
                            ultima_conexion: new Date().toISOString()
                        })
                    });

                    loginError.classList.add('hidden');
                    formLogin.reset();
                    inicializarDashboard();
                } else {
                    loginError.textContent = "Usuario o contraseña incorrectos.";
                    loginError.classList.remove('hidden');
                }
            } catch (error) {
                console.error("Error en la conexión:", error);
                loginError.textContent = "Error al conectar con el servidor.";
                loginError.classList.remove('hidden');
            }
        });

        btnLogout.addEventListener('click', () => {
            usuarioActual = null;
            idRolActual = null;
            idEstudianteAsociado = null;
            vistaDashboard.classList.add('hidden');
            vistaLogin.classList.remove('hidden');
        });

        // --- 5. CONFIGURACIÓN DEL DASHBOARD SEGÚN ROL ---
        function inicializarDashboard() {
            vistaLogin.classList.add('hidden');
            vistaDashboard.classList.remove('hidden');
            
            userDisplay.textContent = usuarioActual;
            roleDisplay.textContent = nombreRolActual;

            const campoConexion = document.getElementById('conexion-display');
            if (campoConexion) {
                campoConexion.textContent = new Date().toLocaleString();
            }

            // Si es Administrador (1) o Docente (2)
            if (idRolActual === 1 || idRolActual === 2) {
                moduloGestion.classList.remove('hidden');
                thAcciones.classList.remove('hidden');
                moduloBusqueda.classList.remove('lg:col-span-3');
                moduloBusqueda.classList.add('lg:col-span-2');
                
                // Los profesores sí pueden usar el buscador libremente
                inputBuscar.disabled = false;
                inputBuscar.value = '';
                btnBuscar.classList.remove('hidden');
                btnLimpiar.classList.remove('hidden');
                
                cargarRegistros(); // Carga el historial completo
            } else {
                // 🔐 SEGURIDAD: Si es Estudiante (Rol 3)
                moduloGestion.classList.add('hidden');
                thAcciones.classList.add('hidden');
                moduloBusqueda.classList.remove('lg:col-span-2');
                moduloBusqueda.classList.add('lg:col-span-3');
                
                // Congela la caja de búsqueda con SU propio ID
                inputBuscar.value = idEstudianteAsociado || '';
                inputBuscar.disabled = true; 
                
                // Oculta los botones para que no intente consultar a otros
                btnBuscar.classList.add('hidden');
                btnLimpiar.classList.add('hidden');
                
                // Carga de forma obligatoria estrictamente sus horas
                cargarRegistros(idEstudianteAsociado); 
            }
        }


        // --- 6. OPERACIONES DE LA BASE DE DATOS (API REST) ---

        // Obtener y mostrar registros (Búsqueda)
                // Obtener y mostrar registros (Búsqueda)
        async function cargarRegistros(filtroEstudiante = '') {
            let url = `${SUPABASE_URL}/rest/v1/horas?select=*,estudiantes(nombre,curso,nivel_escolar),tipo_horas(tipo_horas)`;
            
            if (filtroEstudiante) {
                url += `&id_estudiante=eq.${filtroEstudiante}`;
            }

            try {
                const response = await fetch(url, { method: 'GET', headers: headers });
                const data = await response.json();
                
                if (data.error || !Array.isArray(data)) {
                    console.error("Error de Supabase:", data);
                    tablaCuerpo.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-red-500">Error en la base de datos</td></tr>`;
                    return;
                }
                
                renderTabla(data);
            } catch (error) {
                console.error("Error cargando registros:", error);
            }
        }
        async function eliminarRegistro(id) {
        if (!confirm("¿Está seguro de que desea eliminar este registro de horas?")) return;
        try {
            const response = await fetch(`${SUPABASE_URL}/rest/v1/horas?id=eq.${id}`, {
                method: 'DELETE',
                headers: headers
            });
            if (response.ok) {
                cargarRegistros();
            } else {
                alert("No se pudo eliminar el registro de la base de datos.");
            }
        } catch (error) {
            console.error("Error al eliminar:", error);
        }
    }

        function renderTabla(registros) {
            tablaCuerpo.innerHTML = '';
            if (registros.length === 0) {
                tablaCuerpo.innerHTML = `<tr><td colspan="7" class="text-center py-4 text-gray-500">No se encontraron registros.</td></tr>`;
                return;
            }

            registros.forEach(reg => {
                const fila = document.createElement('tr');
                
                const nombreEstudiante = reg.estudiantes ? reg.estudiantes.nombre : `ID: ${reg.id_estudiante}`;
                const infoCurso = reg.estudiantes ? `${reg.estudiantes.curso} - ${reg.estudiantes.nivel_escolar}` : 'N/A';
                
                // CORREGIDO: Usamos reg.id_tipo en vez de id_tipo suelto
                const tipoHoraStr = reg.tipo_horas ? reg.tipo_horas.tipo_horas : `ID: ${reg.id_tipo}`;
                const fechaFormateada = reg.fecha_hora ? new Date(reg.fecha_hora).toLocaleDateString() : 'S/F';

                let accionesHTML = '';
                
                if (idRolActual === 1 || idRolActual === 2) {
                    let botonEliminar = '';
                    if (idRolActual === 1) {
                        botonEliminar = `<button onclick="eliminarRegistro(${reg.id})" class="text-red-600 hover:text-red-900">Eliminar</button>`;
                    }
                    
                    accionesHTML = `
                        <td class="px-4 py-2 text-xs space-x-2">
                            <button onclick="prepararEditar(${JSON.stringify(reg).replace(/"/g, '&quot;')})" class="text-blue-600 hover:text-blue-900 font-semibold">Editar</button>
                            ${botonEliminar}
                        </td>
                    `;
                }

                fila.innerHTML = `
                    <td class="px-4 py-2 font-medium text-gray-900">${nombreEstudiante}</td>
                    <td class="px-4 py-2 text-gray-600">${infoCurso}</td>
                    <td class="px-4 py-2 text-gray-600">${tipoHoraStr}</td>
                    <td class="px-4 py-2 text-gray-700 font-bold">${reg.numero_horas} h</td>
                    <td class="px-4 py-2 text-gray-500">${fechaFormateada}</td>
                    <td class="px-4 py-2 text-gray-600 max-w-xs truncate">${reg.descripcion}</td>
                    ${accionesHTML}
                `;
                tablaCuerpo.appendChild(fila);
            });
        }

               // Guardar o Modificar Registro (Administrador y Docente)
        formRegistro.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (idRolActual !== 1 && idRolActual !== 2) return;

            const id = document.getElementById('reg-id').value;
            const id_estudiante = document.getElementById('reg-estudiante').value;
            const id_tipohoras = parseInt(document.getElementById('reg-tipo').value);
            const numero_horas = parseInt(document.getElementById('reg-cantidad').value);
            const descripcion = document.getElementById('reg-descripcion').value;

            const payload = {
                id_tipo: id_tipohoras, 
                numero_horas,
                descripcion
            };

            url = `${SUPABASE_URL}/rest/v1/horas`; 
            method = 'POST';

            if (id) {
                url += `?id=eq.${id}`;
                method = 'PATCH';
            } else {
                // Si el ID de tus estudiantes en Supabase es un número entero (int8), debemos convertirlo aquí:
                payload.id_estudiante = parseInt(id_estudiante) || id_estudiante;
                payload.fecha_hora = new Date().toISOString();
            }

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: headers,
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    limpiarFormularioGestion();
                    cargarRegistros();
                    alert(id ? "Registro modificado con éxito." : "Registro agregado con éxito.");
                } else {
                    const errorData = await response.json();
                    alert("Error de Supabase: " + (errorData.message || "Error desconocido"));
                }
            } catch (error) {
                console.error("Error al guardar:", error);
                alert("Ocurrió un error en el envío.");
            }
        });


        // Cargar datos en el formulario para editar
        window.prepararEditar = function(reg) {
            document.getElementById('titulo-form-gestion').textContent = "Modificar Registro de Horas";
            document.getElementById('reg-id').value = reg.id;
            document.getElementById('reg-estudiante').value = reg.id_estudiante;
            
            document.getElementById('reg-estudiante').disabled = true;
            
            document.getElementById('reg-tipo').value = reg.id_tipo;
            document.getElementById('reg-cantidad').value = reg.numero_horas;
            document.getElementById('reg-descripcion').value = reg.descripcion;
            
            document.getElementById('btn-cancelar').classList.remove('hidden');
            document.getElementById('btn-guardar').textContent = "Actualizar";
        };

        document.getElementById('btn-cancelar').addEventListener('click', limpiarFormularioGestion);

        function limpiarFormularioGestion() {
            document.getElementById('titulo-form-gestion').textContent = "Agregar Registro de Horas";
            formRegistro.reset();
            document.getElementById('reg-id').value = '';
            
            document.getElementById('reg-estudiante').disabled = false;
            
            document.getElementById('btn-cancelar').classList.add('hidden');
            document.getElementById('btn-guardar').textContent = "Guardar";
        }

        // --- 7. ACCIONES DEL BUSCADOR ---
        btnBuscar.addEventListener('click', () => cargarRegistros(inputBuscar.value.trim()));
        inputBuscar.addEventListener('keypress', (e) => { if (e.key === 'Enter') cargarRegistros(inputBuscar.value.trim()); });
        btnLimpiar.addEventListener('click', () => { inputBuscar.value = ''; cargarRegistros(); });

//8. TABLA DE ANUNCIOS----

            function inicializarDashboard() {
            vistaLogin.classList.add('hidden');
            vistaDashboard.classList.remove('hidden');
            
            userDisplay.textContent = usuarioActual;
            roleDisplay.textContent = nombreRolActual;

            const campoConexion = document.getElementById('conexion-display');
            if (campoConexion) {
                campoConexion.textContent = new Date().toLocaleString();
            }

            if (idRolActual === 1 || idRolActual === 2) {
                moduloGestion.classList.remove('hidden');
                thAcciones.classList.remove('hidden');
                moduloBusqueda.classList.remove('lg:col-span-3');
                moduloBusqueda.classList.add('lg:col-span-2');
                
                inputBuscar.disabled = false;
                inputBuscar.value = '';
                btnBuscar.classList.remove('hidden');
                btnLimpiar.classList.remove('hidden');

                // Mostrar panel de creación a profesores/admin
                moduloCrearAnuncio.classList.remove('hidden');
                moduloListaAnuncios.classList.remove('lg:col-span-3');
                moduloListaAnuncios.classList.add('lg:col-span-2');
                
                cargarRegistros(); 
            } else {
                moduloGestion.classList.add('hidden');
                thAcciones.classList.add('hidden');
                moduloBusqueda.classList.remove('lg:col-span-2');
                moduloBusqueda.classList.add('lg:col-span-3');
                
                inputBuscar.value = idEstudianteAsociado || '';
                inputBuscar.disabled = true; 
                
                btnBuscar.classList.add('hidden');
                btnLimpiar.classList.add('hidden');

                // Expandir lista completa para estudiantes
                moduloCrearAnuncio.classList.add('hidden');
                moduloListaAnuncios.classList.remove('lg:col-span-2');
                moduloListaAnuncios.classList.add('lg:col-span-3');
                
                cargarRegistros(idEstudianteAsociado); 
            }
            // Ejecutar la carga del tablero
            cargarAnuncios();
        }
        // --- MOTOR DEL TABLERO DE ANUNCIOS ---
        formAnuncio.addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                titulo: document.getElementById('anuncio-titulo').value,
                descripcion: document.getElementById('anuncio-descripcion').value,
                cupos_totales: parseInt(document.getElementById('anuncio-cupos').value),
                fecha_evento: document.getElementById('anuncio-fecha').value,
                lugar: document.getElementById('anuncio-lugar').value,
                creado_por: usuarioActual
            };
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/anuncios`, {
                    method: 'POST', headers: headers, body: JSON.stringify(payload)
                });
                if (response.ok) {
                    formAnuncio.reset();
                    alert("¡Anuncio publicado!");
                    cargarAnuncios();
                }
            } catch (error) { console.error(error); }
        });

        async function cargarAnuncios() {
            const divContenedor = document.getElementById('contenedor-anuncios');
            if(!divContenedor) return;
            divContenedor.innerHTML = '<p class="text-xs text-gray-500">Cargando...</p>';
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/anuncios?select=*,inscripciones_anuncios(*)&order=fecha_evento.asc`, { method: 'GET', headers: headers });
                const anuncios = await res.json();
                divContenedor.innerHTML = '';
                
                anuncios.forEach(anuncio => {
                    const inscritos = anuncio.inscripciones_anuncios || [];
                    const cuposDisponibles = anuncio.cupos_totales - inscritos.length;
                    const yaInscrito = inscritos.some(ins => ins.id_estudiante == idEstudianteAsociado);
                    const tarjeta = document.createElement('div');
                    tarjeta.className = "bg-white p-5 rounded-xl border border-gray-200 shadow-sm flex flex-col justify-between";
                    
                    let badge = `<span class="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-0.5 rounded">Cupos: ${inscritos.length}/${anuncio.cupos_totales}</span>`;
                    if (cuposDisponibles <= 0) badge = `<span class="bg-red-100 text-red-800 text-xs font-bold px-2 py-0.5 rounded">Completo</span>`;

                    let btn = '';
                    if (idRolActual === 3) {
                        if (yaInscrito) {
                            btn = `<button onclick="cancelarInscripcion(${anuncio.id})" class="mt-3 w-full bg-red-100 text-red-700 font-bold p-2 rounded-xl text-xs">Cancelar Reserva</button>`;
                        } else if (cuposDisponibles > 0) {
                            btn = `<button onclick="inscribirEstudiante(${anuncio.id})" class="mt-3 w-full bg-blue-600 text-white font-bold p-2 rounded-xl text-xs">Inscribirme</button>`;
                        } else {
                            btn = `<button disabled class="mt-3 w-full bg-gray-100 text-gray-400 p-2 rounded-xl text-xs cursor-not-allowed">Agotado</button>`;
                        }
                    } else {
                        btn = `<div class="mt-3 pt-2 border-t text-[11px] text-gray-500">
                                <b>Lista:</b> ${inscritos.map(i => i.id_estudiante).join(', ') || 'Ninguno'}
                               <button onclick="eliminarAnuncio(${anuncio.id})" class="block mt-2 text-red-500 hover:underline">Eliminar Convocatoria</button>
                               </div>`;
                    }

                    tarjeta.innerHTML = `<div><div class="flex justify-between items-start mb-2"><h4 class="font-bold text-gray-900">${anuncio.titulo}</h4>${badge}</div>
                    <p class="text-xs text-gray-600 mb-2">${anuncio.descripcion}</p>
                    <p class="text-[11px] text-gray-400">📅 ${anuncio.fecha_evento} | 📍 ${anuncio.lugar}</p></div>${btn}`;
                    divContenedor.appendChild(tarjeta);
                });
            } catch (e) { console.error(e); }
        }

        window.inscribirEstudiante = async function(id) {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/inscripciones_anuncios`, {
                    method: 'POST', headers: headers, body: JSON.stringify({ anuncio_id: id, id_estudiante: idEstudianteAsociado.toString() })
                });
                if(res.ok) { alert("Inscrito correctamente"); cargarAnuncios(); }
            } catch (e) { console.error(e); }
        };

        window.cancelarInscripcion = async function(id) {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/inscripciones_anuncios?anuncio_id=eq.${id}&id_estudiante=eq.${idEstudianteAsociado}`, { method: 'DELETE', headers: headers });
                if(res.ok) { alert("Reserva cancelada"); cargarAnuncios(); }
            } catch (e) { console.error(e); }
        };

        window.eliminarAnuncio = async function(id) {
            if(!confirm("¿Eliminar este anuncio?")) return;
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/anuncios?id=eq.${id}`, { method: 'DELETE', headers: headers });
                if(res.ok) cargarAnuncios();
            } catch (e) { console.error(e); }
        };



    </script>
</body>
